name: Validate game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn codegen
      - name: Check generated GraphQL code
        run: git diff --exit-code -- skull-king-web/src/types/graphqlTypes.ts
      - run: corepack yarn test --runInBand
      - run: corepack yarn build
      - run: corepack yarn build:web
      - run: corepack yarn playwright install --with-deps chromium
      - run: corepack yarn test:e2e
      - name: Build deployable image
        run: docker build --tag skull-king:ci .
      - name: Check container startup
        run: |
          docker run --detach --name skull-king-ci --publish 4000:4000 skull-king:ci
          trap 'docker logs skull-king-ci; docker rm --force skull-king-ci' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          curl --fail http://localhost:4000/game/browser-smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
