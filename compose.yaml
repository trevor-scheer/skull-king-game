services:
  game:
    build: .
    init: true
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:4000}"
    volumes:
      - game-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  game-data:
