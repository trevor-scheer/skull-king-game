query GameState($gameId: String!, $playerToken: String!) {
  state(gameId: $gameId, playerToken: $playerToken) {
    id
    scoringMode
    pirateAbilities
    cannonball
    deckConfig { includeMermaids includeKraken includeWhiteWhale includeLoot includeExpansion includeFirstMate includeStingray includeDavyJones includeWalkThePlank includeLastVolley }
    legalCardIds
    players {
      id
      name
      handCount
      isAutomated
      bid
      tricksWon
    }
    me {
      isAutoplay
      id
      name
      handCount
      isAutomated
      bid
      tricksWon
    }
    currentRound {
      id
      phase
      pirateAbility { id name playerId }
      plankChoice { id playerId }
      cardsPerPlayer
      isTieBreaker
      trickColor
      hands { id }
      lastCompletedHand { id }
      leader
      playerTurn
      myBid
      bidRevealEndsAt
      roundNumber
      cardsPlayed {
        id
        playerId
      }
    }
  }
}
