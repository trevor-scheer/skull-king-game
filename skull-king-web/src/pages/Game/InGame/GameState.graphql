query GameState($gameId: String!, $playerToken: String!) {
  state(gameId: $gameId, playerToken: $playerToken) {
    id
    players {
      id
      name
    }
    me {
      id
      name
    }
    currentRound {
      id
      phase
      pirateAbility { id }
      leader
      playerTurn
      myBid
      roundNumber
      cardsPlayed {
        id
        playerId
      }
    }
  }
}
