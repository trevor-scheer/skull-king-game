query MyHand($gameId: String!, $playerToken: String!) {
  state(gameId: $gameId, playerToken: $playerToken) {
    id
    legalCardIds
    me {
      id
      name
      hand {
        ... on SpecialCard {
          id
          type
        }
        ... on ColoredCard {
          id
          color
          choice
          wild
          expansion
          number
        }
      }
    }
    currentRound {
      id
      phase
      playerTurn
      trickColor
      myForcedCardId
      myBid
    }
  }
}
