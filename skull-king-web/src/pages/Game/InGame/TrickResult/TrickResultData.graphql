query TrickResultData($gameId: String!, $playerToken: String!) {
  state(gameId: $gameId, playerToken: $playerToken) {
    id
    phase
    currentRound {
      id
      phase
      pirateAbility { id }
      roundNumber
      leader
      playerTurn
      myBid
      trickColor
      cardsPlayed {
        id
        playerId
      }
      lastCompletedHand {
        id
        trickColor
        trickDiscarded
        removedCardIds
        cardsPlayed {
          id
          playerId
          card {
            __typename
            ... on SpecialCard {
              id
              type
              selection
            }
            ... on ColoredCard {
              id
              color
              number
            }
          }
        }
        winningCard {
          id
          playerId
          card {
            __typename
            ... on SpecialCard {
              id
              type
              selection
            }
            ... on ColoredCard {
              id
              color
              number
            }
          }
        }
      }
    }
  }
}
