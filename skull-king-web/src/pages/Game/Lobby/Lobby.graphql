query LobbyQuery($gameId: String!, $playerToken: String) {
  state(gameId: $gameId, playerToken: $playerToken) {
    id
    me { id }
    roundSchedule
    tieBreakers
    cannonball
    maxPlayers
    scoringMode
    pirateAbilities
    deckConfig {
      includeMermaids
      includeKraken
      includeWhiteWhale
      includeExpansion
      includeFirstMate
      includeStingray
      includeDavyJones
      includeWalkThePlank
      includeLastVolley
      includeLoot
    }
    players {
      id
      name
    }
  }
}
